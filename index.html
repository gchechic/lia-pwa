<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#2E7D32">

    <link rel="manifest" href="manifest.json?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=3">
    <link rel="stylesheet" href="styles.css">

    <title>Lia</title>
</head>

<body>

    <main class="app">
        <h1>Lia</h1>

        <input
            id="movimiento"
            type="text"
            placeholder="Ej.: Farmacia 18500"
            autocomplete="off"
        >

        <button id="registrar">
            Registrar
        </button>

        <section id="confirmacion" class="confirmacion" hidden aria-labelledby="confirmacion-titulo">
            <h2 id="confirmacion-titulo">¿Confirmamos este movimiento?</h2>
            <p id="confirmacion-detalle" class="confirmacion-detalle"></p>
            <div class="confirmacion-acciones">
                <button id="editar" class="button-secondary" type="button">Editar</button>
                <button id="confirmar" type="button">Confirmar</button>
            </div>
        </section>

        <div id="estado">
            Esperando...
        </div>
    </main>

    <script src="app.js?v=3"></script>

</body>
</html>
